    <script>
      (async () => {
        const ECDH_PARAMS = { name: "ECDH", namedCurve: "P-256" };

        function formatViewerErrorMessage(value, fallback) {
          fallback = fallback || "An unknown error occurred.";
          if (value == null || value === "") return fallback;
          if (typeof value === "string") return value;
          if (value instanceof Error) return value.message || fallback;
          if (typeof value === "object") {
            if (typeof value.message === "string" && value.message) {
              return value.message;
            }
            if (typeof value.reason === "string" && value.reason) {
              return value.reason;
            }
            if (typeof value.text === "string" && value.text) return value.text;
          }
          var s = String(value);
          return s === "[object Object]" ? fallback : s;
        }

        window.notifyParentError = function (title, message, msgboxType) {
          const target =
            window.opener || (window.parent !== window ? window.parent : null);
          if (target && window.__parentOrigin) {
            const cleanTitle = formatViewerErrorMessage(title, "Error");
            const cleanMessage = formatViewerErrorMessage(message, cleanTitle);
            target.postMessage(
              {
                type: "VIEWER_ERROR",
                title: cleanTitle,
                message: cleanMessage,
                msgboxType:
                  typeof msgboxType === "string" ? msgboxType : "error",
              },
              window.__parentOrigin,
            );
          }
        };

        try {
          if (document.referrer) {
            window.__parentOrigin = new URL(document.referrer).origin;
          }
        } catch (e) {
          console.warn("viewer: invalid document.referrer", e);
        }

        try {
          const keyPair = await crypto.subtle.generateKey(ECDH_PARAMS, true, [
            "deriveKey",
            "deriveBits",
          ]);
          window.__viewerPrivateKey = keyPair.privateKey;
          const spki = await crypto.subtle.exportKey("spki", keyPair.publicKey);
          const spkiBytes = new Uint8Array(spki);
          let binary = "";
          for (let i = 0; i < spkiBytes.length; i++) {
            binary += String.fromCharCode(spkiBytes[i]);
          }
          const publicKey = btoa(binary);

          if (window.opener && window.__parentOrigin) {
            window.opener.postMessage(
              { type: "VIEWER_READY", version: 1, publicKey },
              window.__parentOrigin,
            );
          } else {
            console.warn(
              "viewer: cannot send VIEWER_READY (missing opener or parent origin)",
            );
          }
        } catch (e) {
          console.error("viewer: key generation failed", e);
          window.notifyParentError(
            "Error",
            "Failed to initialize viewer",
            "error",
          );
        }
      })();
    </script>
